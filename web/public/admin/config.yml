# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Painel de conteúdo do Projeto Regenere (Sveltia CMS).
# ------------------------------------------------------------------------------
# O CMS grava direto no repositório do GitHub; o GitHub Actions reconstrói o site
# e publica na HostGator. Os caminhos abaixo são relativos à RAIZ DO REPOSITÓRIO
# (por isso começam em `web/`).
#
# ⚠ Regra de ouro ao editar este arquivo: todo campo existente no JSON precisa
# estar declarado aqui. Campos não declarados são APAGADOS quando o editor salva.
# Rode `npm run cms:check` depois de qualquer alteração.

backend:
  name: github
  repo: igorstutz/projeto-regenere
  branch: main
  # Autenticação por OAuth ("Entrar com GitHub"): descomente e aponte para o
  # Cloudflare Worker do sveltia-cms-auth. Enquanto estiver comentado, o login
  # é feito pelo botão "Sign In with Token" (token pessoal do GitHub).
  # base_url: https://sveltia-cms-auth.SEU-SUBDOMINIO.workers.dev
  commit_messages:
    create: 'conteúdo: cria {{collection}} "{{slug}}"'
    update: 'conteúdo: atualiza {{collection}} "{{slug}}"'
    delete: 'conteúdo: remove {{collection}} "{{slug}}"'
    uploadMedia: 'conteúdo: envia imagem {{path}}'
    deleteMedia: 'conteúdo: remove imagem {{path}}'

site_url: https://projeto-regenere.com.br
display_url: https://projeto-regenere.com.br
logo_url: /images/brand/logo.webp

# Imagens enviadas pelo painel. As já existentes ficam acessíveis pelas coleções
# de mídia abaixo (Fotos, Marca, Patrocinadores, Parceiros).
media_folder: /web/public/images/uploads
public_folder: /images/uploads

media_libraries:
  default:
    config:
      max_file_size: 10000000
      slugify_filename: true
      # Toda imagem enviada é convertida para WebP e reduzida — mesmo padrão das
      # imagens já otimizadas do site.
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1800

asset_collections:
  - name: fotos
    label: Fotos
    media_folder: /web/public/images/photos
    public_folder: /images/photos
  - name: patrocinadores
    label: Logos de patrocinadores
    media_folder: /web/public/images/sponsors
    public_folder: /images/sponsors
  - name: parceiros
    label: Logos de parceiros
    media_folder: /web/public/images/partners
    public_folder: /images/partners
  - name: marca
    label: Marca
    media_folder: /web/public/images/brand
    public_folder: /images/brand

collections:
  # ============================================================================
  # PÁGINAS — cada arquivo corresponde a uma página do site.
  # ============================================================================
  - name: paginas
    label: Páginas
    editor:
      preview: false
    files:
      # ---------------------------------------------------------------- Início
      - name: home
        label: Início
        file: web/src/content/data/home.json
        fields:
          - name: seo
            label: SEO — como a página aparece no Google
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Título na busca, widget: string }
              - { name: description, label: Descrição na busca, widget: text }
          - name: hero
            label: Topo da página
            widget: object
            fields:
              - { name: eyebrow, label: Rótulo acima do título, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: subtitle, label: Subtítulo, widget: text }
              - name: slides
                label: Imagens do carrossel
                label_singular: Imagem
                widget: list
                summary: '{{alt}}'
                thumbnail: src
                fields:
                  - { name: src, label: Imagem, widget: image }
                  - name: alt
                    label: Texto alternativo
                    widget: string
                    hint: Descrição da imagem para leitores de tela e para o Google.
                  - { name: caption, label: Legenda, widget: string, required: false }
              - name: primary
                label: Botão principal
                widget: object
                fields:
                  - { name: label, label: Texto, widget: string }
                  - { name: href, label: Link, widget: string }
              - name: secondary
                label: Botão secundário
                widget: object
                fields:
                  - { name: label, label: Texto, widget: string }
                  - { name: href, label: Link, widget: string }
          - name: stats
            label: Números em destaque
            label_singular: Número
            widget: list
            summary: '{{value}} — {{label}}'
            fields:
              - { name: value, label: Número, widget: string, hint: 'Ex.: "100+", "12", "3 mil".' }
              - { name: label, label: Rótulo, widget: string }
              - { name: description, label: Descrição, widget: text, required: false }
              - name: icon
                label: Ícone
                widget: select
                required: false
                options:
                  - users
                  - store
                  - repeat
                  - leaf
                  - sparkles
                  - network
                  - trendingUp
                  - mappin
          - name: about

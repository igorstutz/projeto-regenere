          - name: seo
            label: SEO — como a página aparece no Google
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Título na busca, widget: string }
              - { name: description, label: Descrição na busca, widget: text }
          - name: hero
            label: Topo da página
            widget: object
            fields:
              - { name: eyebrow, label: Rótulo, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: intro, label: Introdução, widget: text }
          - name: paths
            label: Bloco "Formas de apoiar"
            widget: object
            fields:
              - { name: eyebrow, label: Rótulo, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: intro, label: Introdução, widget: text }
              - name: items
                label: Formas de apoiar
                label_singular: Forma
                widget: list
                summary: '{{title}}'
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descrição, widget: text }
                  - name: icon
                    label: Ícone
                    widget: select
                    required: false
                    options: [leaf, sparkles, network, users, store, repeat, target, clipboard, lightbulb, trendingUp, mappin]
                  - name: items
                    label: Itens da lista
                    label_singular: Item
                    widget: list
                    field: { name: texto, label: Item, widget: string }
          - name: highlight
            label: Frase de destaque
            widget: object
            fields:
              - { name: statement, label: Frase, widget: text }
              - { name: image, label: Imagem, widget: image }
          - name: enables
            label: Bloco "O que o apoio viabiliza"
            widget: object
            fields:
              - { name: eyebrow, label: Rótulo, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: intro, label: Introdução, widget: text }
              - name: items
                label: Itens
                label_singular: Item
                widget: list
                summary: '{{title}}'
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descrição, widget: text }
                  - name: icon
                    label: Ícone
                    widget: select
                    required: false
                    options: [leaf, sparkles, network, users, store, repeat, target, clipboard, lightbulb, trendingUp, mappin]
          - name: steps
            label: Bloco "Como começar"
            widget: object
            fields:
              - { name: eyebrow, label: Rótulo, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: intro, label: Introdução, widget: text }
              - name: items
                label: Etapas
                label_singular: Etapa
                widget: list
                summary: '{{title}}'
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descrição, widget: text }
          - name: cta
            label: Chamada final
            widget: object
            fields:
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descrição, widget: text, required: false }
              - name: primary
                label: Botão principal
                widget: object
                fields:
                  - { name: label, label: Texto, widget: string }
                  - { name: href, label: Link, widget: string }
              - name: secondary
                label: Botão secundário
                widget: object
                required: false
                fields:
                  - { name: label, label: Texto, widget: string }
                  - { name: href, label: Link, widget: string }

      # --------------------------------------------------------------- Contato
      - name: contato
        label: Contato
        file: web/src/content/data/contato.json
        fields:
          - name: seo
            label: SEO — como a página aparece no Google
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Título na busca, widget: string }
              - { name: description, label: Descrição na busca, widget: text }
          - name: hero
            label: Topo da página
            widget: object
            fields:
              - { name: eyebrow, label: Rótulo, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: intro, label: Introdução, widget: text }
          - name: panel
            label: Painel lateral
            hint: E-mail, telefone e redes sociais ficam em "Configurações → Dados do site".
            widget: object
            fields:
              - { name: title, label: Título, widget: string }
              - { name: text, label: Texto, widget: text }
          - { name: formTitle, label: Título do formulário, widget: string }
          - { name: formNote, label: Aviso abaixo do formulário, widget: text }

      # ------------------------------------------------- Política de Privacidade
      - name: privacidade
        label: Política de Privacidade
        file: web/src/content/data/privacidade.json
        fields:
          - name: seo
            label: SEO — como a página aparece no Google
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Título na busca, widget: string }
              - { name: description, label: Descrição na busca, widget: text }
          - name: hero
            label: Topo da página
            widget: object
            fields:
              - { name: eyebrow, label: Rótulo, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: intro, label: Introdução, widget: text }
          - name: updatedAt
            label: Última atualização
            widget: string
            hint: >-
              Texto livre, ex.: "Junho de 2026". ⚠ Esta política é uma minuta sujeita
              a revisão jurídica (LGPD); alterações aqui mudam o texto público.
          - name: sections
            label: Seções
            label_singular: Seção
            widget: list
            summary: '{{title}}'
            collapsed: true
            fields:
              - name: id
                label: Identificador
                widget: string
                hint: >-
                  Sem espaços nem acentos (ex.: "cookies"). Usado no índice
                  lateral e no link direto para a seção.
              - { name: title, label: Título, widget: string }
              - name: paragraphs
                label: Parágrafos
                label_singular: Parágrafo
                widget: list
                field: { name: texto, label: Parágrafo, widget: text }
              - name: items
                label: Lista de itens
                label_singular: Item
                widget: list
                required: false
                field: { name: texto, label: Item, widget: text }

  # ============================================================================
  # EXPERIÊNCIAS — um arquivo por estudo de caso; o nome do arquivo vira a URL.
  # ============================================================================
  - name: experiencias
    label: Experiências
    label_singular: Experiência
    folder: web/src/content/data/experiencias
    extension: json
    format: json
    create: true
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}} — {{location}}'
    thumbnail: image
    sortable_fields: [order, name]
    editor:
      preview: false
    description: >-
      Cada experiência vira uma página em /experiencias/<endereço>/. O endereço é
      gerado a partir do nome ao criar a experiência e não muda depois.
    fields:
      - name: order
        label: Ordem
        widget: number
        value_type: int
        default: 99
        hint: Menor número aparece primeiro nas listagens.
      - { name: name, label: Nome, widget: string }
      - { name: kind, label: Tipo, widget: string, hint: 'Ex.: "Território urbano".' }
      - { name: location, label: Localização, widget: string, hint: 'Ex.: "Porto Alegre · RS".' }
      - { name: subtitle, label: Subtítulo, widget: string }
      - name: summary
        label: Resumo
        widget: text
        hint: Uma frase — aparece nos cartões de listagem.
      - name: seo
        label: SEO — como a página aparece no Google
        widget: object
        collapsed: true
        fields:
          - { name: title, label: Título na busca, widget: string }
          - { name: description, label: Descrição na busca, widget: text }
      - { name: image, label: Imagem principal, widget: image }
      - name: gallery
        label: Galeria
        label_singular: Foto
        widget: list
        field: { name: foto, label: Foto, widget: image }
      - name: context
        label: Contexto do território
        label_singular: Parágrafo
        widget: list
        field: { name: texto, label: Parágrafo, widget: text }
      - name: actions
        label: Ações realizadas
        label_singular: Ação
        widget: list
        field: { name: texto, label: Ação, widget: text }
      - { name: objective, label: Objetivo, widget: text }
      - name: results
        label: Resultados
        label_singular: Resultado
        widget: list
        summary: '{{value}} — {{label}}'
        fields:
          - { name: value, label: Número, widget: string }
          - { name: label, label: Rótulo, widget: string }
          - { name: description, label: Descrição, widget: text, required: false }
          - name: icon
            label: Ícone
            widget: select
            required: false
            options: [users, store, repeat, leaf, sparkles, network, trendingUp, mappin]

  # ============================================================================
  # CONFIGURAÇÕES — dados que aparecem em todas as páginas.
  # ============================================================================
  - name: configuracoes
    label: Configurações
    editor:
      preview: false
    files:
      - name: site
        label: Dados do site
        file: web/src/content/data/site.json
        fields:
          - name: name
            label: Nome do projeto
            widget: string
            hint: Usado no rodapé, no SEO e nos dados estruturados de todas as páginas.
          - { name: shortName, label: Nome curto, widget: string }
          - { name: tagline, label: Frase de apresentação, widget: string }
          - name: description
            label: Descrição padrão (SEO)
            widget: text
            hint: Usada quando a página não tem descrição própria.
          - name: url
            label: Endereço do site
            widget: string
            hint: Sem barra no final. Alterar só em caso de troca de domínio.
          - name: locale
            label: Idioma
            widget: string
            hint: 'Formato BCP-47, ex.: "pt-BR".'
          - name: contact
            label: Contato
            widget: object
            fields:
              - { name: email, label: E-mail, widget: string }
              - { name: phone, label: Telefone (exibido), widget: string, required: false }
              - name: phoneHref
                label: Telefone (link)
                widget: string
                required: false
                hint: 'Só números com país, ex.: "+555199999999".'
              - { name: whatsapp, label: WhatsApp, widget: string, required: false }
              - name: addresses
                label: Endereços
                label_singular: Endereço
                widget: list
                required: false
                summary: '{{label}}'
                fields:
                  - { name: label, label: Rótulo, widget: string, required: false }
                  - name: lines
                    label: Linhas do endereço
                    label_singular: Linha
                    widget: list
                    field: { name: texto, label: Linha, widget: string }
          - name: social
            label: Redes sociais
            widget: object
            fields:
              - { name: instagram, label: Instagram, widget: string, required: false }

      - name: navegacao
        label: Menus
        file: web/src/content/data/navegacao.json
        fields:
          - name: mainNav
            label: Menu principal
            label_singular: Item
            hint: Itens exibidos no topo do site, na ordem em que aparecem aqui.
            widget: list
            summary: '{{label}}'
            fields:
              - { name: label, label: Texto, widget: string }
              - { name: href, label: Link, widget: string }
              - { name: description, label: Descrição, widget: string, required: false }
          - name: primaryCta
            label: Botão de destaque do topo
            widget: object
            fields:
              - { name: label, label: Texto, widget: string }
              - { name: href, label: Link, widget: string }
              - { name: description, label: Descrição, widget: string, required: false }
          - name: footerNav
            label: Menus do rodapé
            label_singular: Coluna
            widget: list
            summary: '{{title}}'
            fields:
              - { name: title, label: Título da coluna, widget: string }
              - name: items
                label: Itens
                label_singular: Item
                widget: list
                summary: '{{label}}'
                fields:
                  - { name: label, label: Texto, widget: string }
                  - { name: href, label: Link, widget: string }
                  - { name: description, label: Descrição, widget: string, required: false }

      - name: depoimentos
        label: Depoimentos
        file: web/src/content/data/depoimentos.json
        fields:
          - name: items
            label: Depoimentos
            label_singular: Depoimento
            hint: >-
              ⚠ Textos provisórios — substituir por depoimentos reais, com
              autorização de uso de nome e imagem. Aparecem no carrossel da
              página inicial.
            widget: list
            summary: '{{name}}'
            fields:
              - { name: quote, label: Depoimento, widget: text }
              - { name: name, label: Nome, widget: string }
              - { name: role, label: Função / local, widget: string }

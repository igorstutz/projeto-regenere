                  - { name: logo, label: Logo, widget: image }
                  - name: description
                    label: Descrição
                    widget: text
                    hint: Texto exibido ao clicar no logo.
                  - name: url
                    label: Site oficial
                    widget: string
                    required: false
                    hint: 'Endereço completo, começando por https://'
          - name: cta
            label: Chamada final
            widget: object
            fields:
              - { name: title, label: Título, widget: string }
              - { name: description, label: Descrição, widget: text, required: false }
              - name: primary
                label: Botão principal
                widget: object
                fields:
                  - { name: label, label: Texto, widget: string }
                  - { name: href, label: Link, widget: string }
              - name: secondary
                label: Botão secundário
                widget: object
                required: false
                fields:
                  - { name: label, label: Texto, widget: string }
                  - { name: href, label: Link, widget: string }

      # ----------------------------------------------------------- Como apoiar
      - name: como-apoiar
        label: Como apoiar

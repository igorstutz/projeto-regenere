name: Publicar site (HostGator)

# Toda edição feita no painel /admin vira um commit neste repositório. Este
# workflow reconstrói o site e o envia por FTP para a HostGator — é o que faz a
# alteração aparecer em projeto-regenere.com.br, alguns minutos depois de salvar.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   FTP_HOST, FTP_USER, FTP_PASSWORD  — obrigatórios
#   FTP_PORT, FTP_REMOTE_DIR          — opcionais (padrão: 21 e /public_html)
#
# O envio é tentado em até três runners porque o firewall da HostGator recusa a
# conexão de parte dos IPs do GitHub Actions; cada job sai de um IP diferente.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/publicar-hostgator.yml"
      - ".github/workflows/enviar-ftp.yml"
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez. Não cancelamos a que estiver em andamento: interromper
# um envio FTP pela metade deixaria o site com arquivos de duas versões.
concurrency:
  group: hostgator
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Conferir o painel de conteúdo
        # Falha cedo e com mensagem clara se uma edição tiver removido campos
        # que o site espera encontrar.
        run: npm run cms:check

      - name: Build (exportação estática)
        run: npm run build

      - name: Guardar o site construído
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/out
          retention-days: 1
          include-hidden-files: true

  envio-1:
    needs: construir
    uses: ./.github/workflows/enviar-ftp.yml
    secrets: inherit
    with:
      tentativa: 1

  envio-2:
    needs: [construir, envio-1]
    if: ${{ always() && needs.envio-1.result == 'failure' }}
    uses: ./.github/workflows/enviar-ftp.yml
    secrets: inherit
    with:
      tentativa: 2

  envio-3:
    needs: [construir, envio-2]
    if: ${{ always() && needs.envio-2.result == 'failure' }}
    uses: ./.github/workflows/enviar-ftp.yml
    secrets: inherit
    with:
      tentativa: 3

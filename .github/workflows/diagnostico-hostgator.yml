name: Diagnostico de acesso a HostGator

# Temporário: verifica, a partir de um runner do GitHub, se o servidor da
# HostGator aceita conexão FTP e se a recusa é constante para o IP do runner
# ou intermitente. Pode ser removido depois.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Repetir conexao na porta 21
        run: |
          set +e
          IP=69.6.249.103
          echo "IP de saída deste runner: $(curl -s https://api.ipify.org)"
          ok=0; falha=0
          for i in $(seq 1 6); do
            if timeout 8 bash -c "</dev/tcp/$IP/21" 2>/dev/null; then
              ok=$((ok+1)); echo "tentativa $i: conectou"
            else
              falha=$((falha+1)); echo "tentativa $i: recusada"
            fi
            sleep 4
          done
          echo "RESULTADO porta 21 — conectou: $ok, recusada: $falha"

      - name: Banner dos servicos
        run: |
          set +e
          IP=69.6.249.103
          echo "--- FTP (21) ---"
          timeout 8 bash -c "exec 3<>/dev/tcp/$IP/21 && head -c 120 <&3" || echo "(sem resposta)"
          echo ""
          echo "--- SSH (22) ---"
          timeout 8 bash -c "exec 3<>/dev/tcp/$IP/22 && head -c 60 <&3" || echo "(sem resposta)"
          echo ""
          echo "--- SSH (2222) ---"
          timeout 8 bash -c "exec 3<>/dev/tcp/$IP/2222 && head -c 60 <&3" || echo "(sem resposta)"
